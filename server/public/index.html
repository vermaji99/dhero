<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>LeadFlow API</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0b0f;
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      max-width: 560px;
      padding: 2.5rem;
      border-radius: 1rem;
      background: linear-gradient(180deg, #16161d 0%, #0f0f15 100%);
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.6);
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0.25rem 0;
      color: #9ca3af;
      line-height: 1.6;
      font-size: 0.95rem;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.12);
      color: #4ade80;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 0 4px rgba(74, 222, 128, 0.15);
    }
    code {
      background: rgba(255, 255, 255, 0.05);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.85em;
    }
    footer {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.8rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>LeadFlow API</h1>
    <p>Backend service for the LeadFlow lead management platform.</p>
    <p>Health check: <code>GET /api/health</code></p>
    <div class="status">
      <span class="dot"></span>
      <span>Service Online</span>
    </div>
    <footer>
      MongoDB &middot; NestJS &middot; Prisma &mdash; &copy; LeadFlow
    </footer>
  </div>
</body>
</html>
